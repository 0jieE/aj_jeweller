# In front of gunicorn: serves the photos and receipts straight off disk, and
# passes everything else through.
server {
    listen 80;
    server_name _;

    # A purchase can carry several photos; the app sends them inline.
    client_max_body_size 25m;

    # Photos and receipt PDFs. Signed URLs are not used, so these are only as
    # private as the network they are on — keep the server off the open
    # internet, or put TLS and a firewall in front of it.
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "private";
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A phone that has been offline for a day pushes its whole queue at
        # once, and the import sends the shop's entire history in one request.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
