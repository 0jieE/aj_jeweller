# Development database only. The Django app runs on the host (see README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aj_jeweler
      POSTGRES_USER: aj
      POSTGRES_PASSWORD: aj
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aj -d aj_jeweler"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
