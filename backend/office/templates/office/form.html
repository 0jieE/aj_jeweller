{% extends "office/base.html" %}
{% block content %}
<section class="card form-card">
  <h1>{{ title }}</h1>
  {% if note %}<p class="muted">{{ note }}</p>{% endif %}
  {% if error %}<p class="refusal">{{ error }}</p>{% endif %}
  <form method="post"{% if multipart %} enctype="multipart/form-data"{% endif %}>
    {% csrf_token %}
    {% include "office/_fields.html" %}
    <div class="toolbar">
      <button class="button" type="submit">Save</button>
      {% if back_url %}<a href="{% url back back_url %}">Cancel</a>{% else %}<a href="{% url back %}">Cancel</a>{% endif %}
    </div>
  </form>
</section>
{% endblock %}
